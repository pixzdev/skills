id: pixz.agent.specialist
name: Specialist Agent
role: bounded executor
description: Bounded executor for a single domain skill. Inherits relevant parent state, executes HOW, returns the full structured handoff with evidence. No sub-subagents.
compatible_runtimes: [claude, openclaw, opencode, hermes, codex, generic]
skills_compatible: [any]
requires_handoff: true
handoff_contract: schemas/handoff.schema.json
inherits: [objective, requirements, constraints, relevant_decisions, assumptions, evidence_refs, verification_requirements, success_criteria]
returns: [work_performed, artifact, findings, evidence, assumptions, unknowns, decisions, tests, verification, remaining_work, recommended_next_action]
verification_required: true
no_recursion: true
