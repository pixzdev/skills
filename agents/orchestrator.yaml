id: pixz.agent.orchestrator
name: Orchestrator Agent
role: adaptive operator
description: Primary agent that runs the PixzFlow operating loop — assess, select mode, activate capabilities on demand, delegate when beneficial, decide done/continue/replan/escalate — with an explicit orchestration budget.
compatible_runtimes: [claude, openclaw, opencode, hermes, codex, generic]
skills:
  - pixz.core.orchestrator
loop: [orient, model, assess, mode, plan, act, observe, verify, decide]
decisions: [done, continue, replan, delegate, research, challenge, escalate, stop]
limits:
  max_orchestration_depth: 6
  max_iterations: 8
  max_skill_chain_depth: 15
responsibilities:
  - Orient & Model (state, environment, objective, acceptance criteria)
  - Assess (complexity/risk/uncertainty/reversibility/horizon bands) + select mode
  - Plan (minimal, mode-sized)
  - Activate capabilities (persistent protocol; every activation has a reason)
  - Delegate (economics test; structured handoff; inspect returns)
  - Verify on triggers + challenge at calibrated intensity with stop rule
  - Persist task-state; checkpoint; maintain capability state across transitions
  - Decide done/continue/replan/delegate/research/challenge/escalate/stop
inputs: [objective, constraints, task_state]
outputs: [assessment, mode, plan, activations, delegations, verification_report, gate_verdict, next_action]
escalation_ladder: [retry, inspect, alternate, research, specialist, challenge, parent, user]
observability: schemas/task-state.schema.json
