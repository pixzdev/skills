id: pixz.core.orchestrator
name: Orchestrator
version: 2.1.0
category: core
description: MAIN PixzFlow operating skill. Assesses the task, selects mode, activates capabilities, delegates, inspects, challenges, verifies, replans, and ships. Use for complex/multi-step work. Do not use for trivial reversible edits. Load references/operating-methodology.md for the full practical loop.
triggers: [orchestrate, coordinate, delegate, complex task, multi-step]
compatible_runtimes: [claude, openclaw, opencode, hermes, codex, generic]
requires: []
aggregates:
  - pixz.core.verification
optional:
  - pixz.core.planning
  - pixz.core.context-engineering
  - pixz.core.environment-awareness
  - pixz.core.capability-discovery
  - pixz.core.workflow-continuity
  - pixz.core.delegation-handoff
  - pixz.core.epistemic-reasoning
  - pixz.core.epistemic-challenger
  - pixz.core.replanning
  - pixz.core.quality-gate
  - pixz.core.change-safety
  - pixz.quality.anti-ai-slop
  - pixz.core.self-learning
conflicts: []
