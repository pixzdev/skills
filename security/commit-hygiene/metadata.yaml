id: pixz.security.commit-hygiene
name: Commit Hygiene
category: security
version: 1.0.0
status: stable
description: Pre-commit and pre-push hygiene gate — detect and block secrets about to be committed, review the manifest/lockfile diff for unintended dependency changes, verify the commit message matches the diff, and keep the tree clean of stray artifacts. Use right before committing or pushing.
triggers:
- pre-commit
- secret scan
- commit hygiene
- dependency review
- supply chain
requires: []
aggregates: []
optional:
- pixz.core.change-safety
- pixz.security.review
conflicts: []
compatible_runtimes:
- claude
- openclaw
- opencode
- hermes
- codex
- generic
inputs:
- objective
- constraints
- context
outputs:
- artifact
- findings
- verification
tools: []
